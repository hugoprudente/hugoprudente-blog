- company:
    name: Workday
    url: https://www.workday.com
    location: Dublín
  positions:
  - designation: Principal Site Reliability Engineer
    start: May 2024
    responsibilities:
    - 'Operate Workday''s private cloud on OpenStack: 200+ clusters, 20,000 hypervisors and 100,000+ VMs'
    - Run 70+ Kubernetes clusters on that infrastructure, with lifecycle managed through Cluster API (CAPI/CAPO)
    - One of 2 lead architects of the air-gapped Kubernetes platform, from design through production deployment
    - Deliver seamless in-place Kubernetes upgrades from 1.31 to 1.37 with zero downtime, using Cilium
    - 'Own the platform lifecycle: OS image pipeline (CentOS Stream 10), kube-bench security compliance and ArgoCD performance tuning'
    - 'Built observability for the platform: alerts and runbooks for Cilium, CoreDNS, Cluster Autoscaler, Metrics Server and the OpenStack cloud controller, plus alerting on hypervisor crashes with VMs'
    - 'Hardened security and secrets management: OIDC (Dex SSO) on AWX, credential rotation automation and OpenBAO evaluation'
    - Built agentic AI/LLM automation with a Slackbot that monitors AWX, the internal Ansible executor and Prometheus Alertmanager. It acts on alerts by running runbooks to collect logs and confirm the issue, then uses an LLM to analyze the logs and select the right deterministic Ansible playbook to execute
  - designation: Senior Site Reliability Engineer (SRE)
    start: Aug 2020
    responsibilities:
    - Created the global standard and zero-touch automation for removing OpenStack hypervisors from service for upgrades, reducing operational toil by 90%
    - Led the "Operational Automation in Openstack/Centos migration to match previous version" epic, bringing the newer OpenStack platform to parity with the older one
    - Automated hardware-failure handling (Ceph drive swaps and DIMM/CPU failures) into the data-center ticket workflow, with time-saved tracking for ROI
    - Built per-data-center Grafana dashboards for hypervisor health and impacted instances, so SREs could self-serve tenant issues
    end: May 2024
