  - name: Capstone
    content: 'Group capstone project on mass-distribution calculations over the axles in road freight transport, developed in Java EE with Hibernate and Tomcat, using a MySQL database on a Linux platform.


      Why it matters: the weight on each axle matters more than the total weight. Pavement damage grows with roughly the fourth power of axle load, legal limits apply per axle and not only in total, and uneven loads affect braking, steering, rollover risk and tire and suspension wear.'
