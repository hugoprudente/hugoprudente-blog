# Toha site config (use with: make serve-toha / make build-toha)
baseURL: http://localhost:1313/
title: Hugo Prudente

module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static/files
      target: static/files
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

languages:
  en:
    languageCode: en
    languageName: English
    title: Hugo Prudente
    weight: 1
  pt-br:
    languageCode: pt-br
    languageName: Português (BR)
    title: Hugo Prudente
    weight: 2

defaultContentLanguage: en
defaultContentLanguageInSubdir: true

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

enableEmoji: true

params:
  background: /images/site/background.jpg
  logo:
    main: /images/site/main-logo.png
    inverted: /images/site/inverted-logo.png
    favicon: /images/site/favicon.png

  gitRepo: https://github.com/hugoprudente/hugoprudente-blog
  gitBranch: master

  topNavbar:
    maxVisibleSections: 7

  features:
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system

    portfolio:
      enable: true

    blog:
      enable: true
      title: Writing
      showAuthor: true
      shareButtons:
        linkedin: true
        twitter: true
        email: true

    notes:
      enable: false

    comment:
      enable: false

    analytics:
      enable: true
      services:
        google:
          id: G-G73E6NWXR0

    support:
      enable: false

    toc:
      enable: true

    tags:
      enable: true
      on_card: true

    flags:
      enable: true
      flagOverwrites:
        - languageCode: en
          countryCode: us
        - languageCode: pt-br
          countryCode: br

    embedpdf:
      enable: false
    flowchart:
      enable: true
      services:
        mermaid:
          theme: default
          darkTheme: dark
    math:
      enable: true
      services:
        katex:
          delimiters:
            - left: $$
              right: $$
              display: true
            - left: '\\['
              right: '\\]'
              display: true
            - left: $
              right: $
              display: false
            - left: '\\('
              right: '\\)'
              display: false
    syntaxHighlight:
      enable: true
      services:
        hljs:
          noHighlightRe: /^no-highlight$/i
    videoPlayer:
      enable: false
    copyCodeButton:
      enable: true
    readingTime:
      enable: true
    pagination:
      maxPostsPerPage: 12

  footer:
    enable: true
    navigation:
      enable: true
      customMenus: true
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: false
